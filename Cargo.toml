[package]
name = "extract-speech"
version = "0.5.1"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["all-formats", "all-codecs", "opt-simd"] }
candle-core = { version = "0.11.0" }
# candle-core = { version = "0.9.1", features = ["accelerate"] }
candle-onnx = { version = "0.11.0" }
accelerate-src = { version = "0.3.2", optional = true, default-features = false }
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "ndarray", "cuda", "tensorrt", "coreml"] }
# ort = { version = "2.0.0-rc.9", features = ["download-binaries", "ndarray", "xnnpack"] }
ndarray = "0.17.2"
byteorder = "1.5.0"
ogg = "0.9.2"
opus = "0.4.0"
hound = "3.5.1"
fast-audio-resampler = "0.4.0"
multiversion = "0.9.0"
anyhow = "*"
chrono = "*"
rayon = "*"
log = "0.4.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
debug = false

[profile.release]
opt-level = 3
lto = true
debug = false
strip = true
