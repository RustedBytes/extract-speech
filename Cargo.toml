[package]
name = "extract-speech"
version = "0.3.0"
edition = "2021"

[patch.crates-io]
audiopus_sys = { git = "https://github.com/crs-org/audiopus-sys-updated.git", branch = "dev" }

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }

symphonia = { version = "0.5.4", features = ["all-formats", "all-codecs", "opt-simd"] }
# symphonia = { version = "0.5.4", features = ["all-formats", "all-codecs"] }

candle-core = { version = "0.8.4" }
# candle-core = { version = "0.8.4", features = ["accelerate"] }
candle-onnx = { version = "0.8.4" }

accelerate-src = { version = "0.3.2", optional = true, default-features = false }

ort = { version = "2.0.0-rc.9", features = ["load-dynamic", "ndarray"] }
# ort = { version = "2.0.0-rc.9", features = ["download-binaries", "ndarray"] }
# ort = { version = "2.0.0-rc.9", features = ["download-binaries", "ndarray", "xnnpack"] }
# ort = { version = "2.0.0-rc.9", features = ["load-dynamic", "ndarray", "cuda"] }

ndarray = "0.16"

byteorder = "1.5.0"
ogg = "0.9.2"
opus = "0.3.0"
hound = "3.5.1"

fixed-resample = "0.8.0"

multiversion = "0.8.0"

anyhow = "*"

chrono = "*"

rayon = "*"

[profile.release]
opt-level = 3
lto = true
