[package]
name = "extract-speech"
version = "0.4.1"
edition = "2021"

[patch.crates-io]
audiopus_sys = { git = "https://github.com/crs-org/audiopus-sys-updated.git", branch = "dev" }

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
symphonia = { version = "0.5.4", features = ["all-formats", "all-codecs", "opt-simd"] }
candle-core = { version = "0.9.1" }
# candle-core = { version = "0.9.1", features = ["accelerate"] }
candle-onnx = { version = "0.9.1" }
accelerate-src = { version = "0.3.2", optional = true, default-features = false }
ort = { version = "2.0.0-rc.10", features = ["load-dynamic", "ndarray", "cuda", "tensorrt"] }
# ort = { version = "2.0.0-rc.9", features = ["download-binaries", "ndarray", "xnnpack"] }
ndarray = "0.16"
byteorder = "1.5.0"
ogg = "0.9.2"
opus = "0.3.0"
hound = "3.5.1"
fixed-resample = "0.9.1"
multiversion = "0.8.0"
anyhow = "*"
chrono = "*"
rayon = "*"
log = "0.4.28"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[profile.dev]
debug = false

[profile.release]
opt-level = 3
lto = true
debug = false
strip = true
