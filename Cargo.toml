[package]
name = "extract-speech"
version = "0.8.0"
edition = "2021"
authors = ["Yehor Smoliakov"]
description = "Voice activity detection inference for Silero, PulseVAD, PyAnnote, FSMN, TEN VAD, and MarbleNet"
repository = "https://github.com/RustedBytes/extract-speech"
homepage = "https://github.com/RustedBytes/extract-speech"
documentation = "https://docs.rs/extract-speech"
readme = "README.md"
license = "MIT"
keywords = ["audio", "speech", "vad", "onnx", "inference"]
categories = ["multimedia::audio"]
include = [
    "/.cargo/config.toml",
    "/CHANGELOG.md",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/docs/**",
    "/examples/**",
    "/extract_speech.pyi",
    "/pyproject.toml",
    "/src/**",
]

[lib]
name = "extract_speech"
crate-type = ["rlib", "cdylib"]

[features]
default = ["candle", "download", "onnxruntime"]
candle = ["dep:candle-core", "dep:candle-onnx", "dep:rustfft"]
download = [
    "dep:flate2",
    "dep:sha2",
    "dep:tar",
    "dep:tempfile",
    "dep:ureq",
    "dep:zip",
]
onnxruntime = [
    "dep:kaldi-native-fbank",
    "dep:ndarray",
    "dep:ort",
    "dep:rustfft",
    "dep:ten-vad-rs",
]
python = [
    "candle",
    "download",
    "onnxruntime",
    "dep:pyo3",
]
cli = [
    "candle",
    "download",
    "onnxruntime",
    "dep:byteorder",
    "dep:chrono",
    "dep:clap",
    "dep:fast-audio-resampler",
    "dep:hound",
    "dep:ogg",
    "dep:opus",
    "dep:rayon",
    "dep:serde",
    "dep:serde_json",
    "dep:symphonia",
    "dep:tracing-subscriber",
]
accelerate-src = ["candle", "dep:accelerate-src"]

[[bin]]
name = "extract-speech"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "library-inference"
path = "examples/library-inference.rs"
required-features = ["cli"]

[[example]]
name = "automatic-onnx-inference"
path = "examples/automatic-onnx-inference.rs"
required-features = ["cli", "download", "onnxruntime"]

[dependencies]
anyhow = "1.0"
log = "0.4.34"
byteorder = { version = "1.5.0", optional = true }
candle-core = { version = "0.11.0", optional = true }
candle-onnx = { version = "0.11.0", optional = true }
chrono = { version = "0.4", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
fast-audio-resampler = { version = "0.4.0", optional = true }
flate2 = { version = "1.1.2", optional = true }
hound = { version = "3.5.1", optional = true }
kaldi-native-fbank = { version = "0.1.0", optional = true }
ndarray = { version = "0.17.2", optional = true }
ogg = { version = "0.9.2", optional = true }
opus = { version = "0.4.0", optional = true }
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "ndarray", "cuda", "tensorrt", "coreml"], optional = true }
pyo3 = { version = "0.29.2", optional = true }
rayon = { version = "1.12", optional = true }
rustfft = { version = "6.4.1", optional = true }
sha2 = { version = "0.11.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
symphonia = { version = "0.6.1", features = ["all-formats", "all-codecs", "opt-simd"], optional = true }
ten-vad-rs = { version = "0.1.7", optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
tempfile = { version = "3.27.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }
ureq = { version = "3.1.4", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
accelerate-src = { version = "0.3.2", optional = true, default-features = false }

[profile.dev]
debug = false

[profile.release]
opt-level = 3
lto = true
debug = false
strip = true
