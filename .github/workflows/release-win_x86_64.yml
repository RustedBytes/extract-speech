name: release windows x86_64

on:
  workflow_dispatch:

jobs:
  build:
    name: release windows x86_64

    runs-on: windows-latest

    env:
      LIBOPUS_STATIC: "1"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.x"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
      
      - name: Use cmake
        run: cmake --version

      - name: Build
        run: cargo build --release

      - name: archive extract-speech
        run: Compress-Archive -Path target/release/extract-speech.exe -DestinationPath C:\Users\runneradmin\extract-speech_x86_64_msvc_windows.zip

      - name: upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: extract-speech_x86_64_msvc_windows.zip
          path: C:\Users\runneradmin\extract-speech_x86_64_msvc_windows.zip
