name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    env:
      LIBOPUS_STATIC: "1"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/extract-speech
            asset: extract-speech_x86_64_linux
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/extract-speech
            asset: extract-speech_aarch64_apple_darwin
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/extract-speech.exe
            asset: extract-speech_x86_64_msvc_windows.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Install LLD
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: cargo build --target "${{ matrix.target }}" --release --features cli
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -Clink-arg=-fuse-ld=lld -Ctarget-cpu=native

      - name: Build on macOS or Windows
        if: runner.os != 'Linux'
        run: cargo build --target "${{ matrix.target }}" --release --features cli

      - name: Check Linux binary
        if: runner.os == 'Linux'
        run: readelf -p .comment "${{ matrix.binary }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  wheels:
    name: Build wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            artifact: linux-x86_64
          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: 'off'
            artifact: macos-aarch64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            artifact: windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install supported Python versions
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.9
            3.10
            3.11
            3.12
            3.13
            3.14
            3.15
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.15'
          enable-cache: true

      - name: Install Protoc on macOS and Windows
        if: runner.os != 'Linux'
        uses: arduino/setup-protoc@v3
        with:
          version: '36.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          rust-toolchain: stable
          sccache: true
          before-script-linux: bash scripts/install-protoc-manylinux.sh
          args: >-
            --release --locked --out dist
            --interpreter 3.9 3.10 3.11 3.12 3.13 3.14 3.15

      - name: Smoke-test wheels
        run: uv run --no-project python scripts/test-release-wheels.py dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, wheels]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: extract-speech_*
          path: dist
          merge-multiple: true

      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish wheels to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: wheels
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/extract-speech

    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
