name: release windows aarch64

on:
  workflow_dispatch:

jobs:
  build:
    name: release windows aarch64

    runs-on: windows-latest

    env:
      LIBOPUS_STATIC: "1"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: add aarch64-pc-windows-msvc target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.x"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'
      
      - name: Use cmake
        run: cmake --version

      - name: Build
        run: cargo build --target aarch64-pc-windows-msvc --release

      - name: archive extract-speech
        run: Compress-Archive -Path target/aarch64-pc-windows-msvc/release/extract-speech.exe -DestinationPath C:\Users\runneradmin\extract-audio_aarch64_msvc_windows.zip

      - name: upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: extract-audio_aarch64_msvc_windows.zip
          path: C:\Users\runneradmin\extract-audio_aarch64_msvc_windows.zip
          
