name: Test Rust Code

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**/*.rs'
      - '**/*.py'
      - '**/*.pyi'
      - 'scripts/test-models.sh'
      - 'test-audios/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test-rust.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**/*.rs'
      - '**/*.py'
      - '**/*.pyi'
      - 'scripts/test-models.sh'
      - 'test-audios/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.python-version'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test-rust.yml'

jobs:
  test:
    name: Test Rust Codebase
    runs-on: ubuntu-26.04
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
          version: '0.12.15'
          enable-cache: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-stable

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W clippy::pedantic

      - name: Run tests
        run: cargo test --all-targets --all-features --verbose

      - name: Check library feature combinations
        run: |
          cargo check --lib --no-default-features
          cargo check --lib --no-default-features --features candle
          cargo check --lib --no-default-features --features download
          cargo check --lib --no-default-features --features onnxruntime
          cargo check --lib --no-default-features --features python

      - name: Verify crates.io package
        run: cargo package --locked

      - name: Build CLI
        run: cargo build --features cli --verbose

      - name: Install Python bindings and development tools
        run: uv sync --locked

      - name: Check Python formatting and lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Run Python type checks
        run: uv run --no-sync pyright

      - name: Cache Python inference assets
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/extract-speech-python-cache
          key: python-tests-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Run Python binding tests
        env:
          EXTRACT_SPEECH_TEST_CACHE_DIR: ${{ runner.temp }}/extract-speech-python-cache
        run: uv run --no-sync python -m unittest discover -s tests/python -v

      - name: Cache model test dependencies
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/extract-speech-model-cache
          key: model-tests-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Run model integration tests
        env:
          MODEL_TEST_CACHE_DIR: ${{ runner.temp }}/extract-speech-model-cache
        run: ./scripts/test-models.sh
