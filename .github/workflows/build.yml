name: build

on:
  push:

jobs:
  build:
    name: build

    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf
        run: apt-get update && apt-get install protobuf

      - name: Build
        run: cargo build
  
