name: Build

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get number of CPU cores
        if: runner.os == 'Linux'
        uses: SimenB/github-actions-cpu-cores@v3
        id: cpu-cores

      - name: Install Wild linker
        if: runner.os == 'Linux'
        run: |
          wget "https://github.com/davidlattimore/wild/releases/download/0.10.0/wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz"
          tar xf wild-linker-0.10.0-x86_64-unknown-linux-gnu.tar.gz
          sudo install wild-linker-0.10.0-x86_64-unknown-linux-gnu/wild /usr/local/bin/wild
          wild --version

      - name: Install nightly Rust
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@nightly

      - name: Install stable Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "36.x"

      - name: Setup CMake
        if: runner.os == 'Windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: 'latest'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: cargo build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -Zthreads=${{ steps.cpu-cores.outputs.count }} -Clink-arg=--ld-path=/usr/local/bin/wild

      - name: Check Linux binary
        if: runner.os == 'Linux'
        run: readelf -p .comment target/debug/extract-speech

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: cargo build --features "accelerate-src"

      - name: Build on Windows
        if: runner.os == 'Windows'
        run: cargo build
        env:
          LIBOPUS_STATIC: "1"
